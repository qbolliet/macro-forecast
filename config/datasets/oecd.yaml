# Configuration des requêtes OECD
# Ce fichier définit les paramètres pour chaque dataflow à interroger

# Configuration globale
global:
  agency: "OECD"
  version: "1.0"
  sdmx_version: "v1"  # v1 ou v2

# Liste des pays communs
countries_groups:
  oecd_full: &oecd_full
    - AUS
    - AUT
    - BEL
    - CAN
    - CHL
    - COL
    - CZE
    - DNK
    - EST
    - FIN
    - FRA
    - DEU
    - GRC
    - HUN
    - ISL
    - IRL
    - ISR
    - ITA
    - JPN
    - KOR
    - LVA
    - LTU
    - LUX
    - MEX
    - NLD
    - NZL
    - NOR
    - POL
    - PRT
    - SVK
    - SVN
    - ESP
    - SWE
    - CHE
    - TUR
    - GBR
    - USA
  
  aggregates: &aggregates
    - G-7
    - OECDE
    - G-20
    - OECD
    - NMEC
    - EA19
  
  emerging: &emerging
    - ARG
    - BRA
    - CHN
    - IND
    - IDN
    - RUS
    - SAU
    - ZAF

# Définition des requêtes par dataflow
dataflows:
  
  # Key Short-term Economic Indicators (KEI)
  kei:
    dataflow: "KEI"
    description: "Key Short-term Economic Indicators"
    
    # Définition des dimensions (ordre important)
    dimensions:
      # 0: Indicateurs
      - name: "INDICATOR"
        position: 0
        values:
          - PRINTO01      # Industrial Production
          - SLRTTO01      # Retail trade (Volume)
          - SLRTCR03      # Passenger Car Registration
          - ODCNPI03      # Permit Issued for Dwellings
          - LRHUTTTT      # Monthly Unemployment Rate (All Persons)
          - LCEAMN01      # Hourly Earning : Manufacturing
          - CPALTT01      # Consumer Prices
          - MABMM301      # Broad Money
          - IRSTCI01      # Overnight Interbank Rate
          - IR3TIB01      # 3 Month Interbank Rate
          - IRLTLT01      # Long-term Interest Rate
          - CCUSMA02      # Exchange rates, National currency per US dollar
          - XTEXVA01      # Exports in goods
          - XTIMVA01      # Imports in goods
          - B6BLTT02      # Current account as % of GDP
          - LFEMTTTT      # Labour Force Survey - Employment
          - NAEXKP06      # Exports of goods and services
          - NAEXKP03      # Government Final Consumption Expenditure
          - NAEXKP01      # Gross Domestic Product - Final
          - NAEXKP04      # Gross Fixed Capital Formation
          - NAEXKP07      # Imports of goods and services
          - NAEXKP02      # Private Final Consumption Expenditure
          - SPASTT01      # Share Prices
          - ULQEUL01      # Unit Labour Costs
      
      # 1: Pays
      - name: "LOCATION"
        position: 1
        values:
          - *oecd_full
          - *aggregates
          - *emerging
      
      # 2: Fréquence et ajustement
      - name: "FREQUENCY"
        position: 2
        values:
          - "ST.M"
          - "Q"
    
    # Filtres temporels
    time_filter:
      start_period: null  # null = depuis le début
      end_period: null    # null = jusqu'à maintenant
  
  # Main Economic Indicators Cyclical Indicators (MEI_CLI)
  mei_cli:
    dataflow: "MEI_CLI"
    description: "Main Economic Indicators Cyclical Indicators"
    
    dimensions:
      # 0: Indicateurs
      - name: "INDICATOR"
        position: 0
        values:
          - LOLITOAA      # Leading Indicator
          - LORSGPRT      # GDP Ratio to trend
      
      # 1: Pays
      - name: "LOCATION"
        position: 1
        values:
          - AUS
          - AUT
          - BEL
          - CAN
          - CHL
          - CZE
          - DNK
          - EST
          - FIN
          - FRA
          - DEU
          - GRC
          - HUN
          - ISL
          - IRL
          - ISR
          - ITA
          - JPN
          - KOR
          - LUX
          - MEX
          - NLD
          - NZL
          - NOR
          - POL
          - PRT
          - SVK
          - SVN
          - ESP
          - SWE
          - CHE
          - TUR
          - GBR
          - USA
          - EA19
          - G-7
          - OECDE
          - OECD
          - BRA
          - CHN
          - IND
          - IDN
          - RUS
          - ZAF
      
      # 2: Fréquence
      - name: "FREQUENCY"
        position: 2
        values:
          - "M"
    
    time_filter:
      start_period: null
      end_period: null
  
  # Monthly Financial Indicators (MEI_FIN)
  mei_fin:
    dataflow: "MEI_FIN"
    description: "Monthly Financial Indicators"
    
    dimensions:
      # 0: Indicateurs
      - name: "INDICATOR"
        position: 0
        values:
          - MANM          # Narrow Money
          - SP            # Share Prices
          - CCRETT01      # Relative consumer Prices
          - CCRETT02      # Relative unit labor cost
          - IR3TIB        # Short term interest rates
      
      # 1: Pays
      - name: "LOCATION"
        position: 1
