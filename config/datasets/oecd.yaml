  # Business Tendency and Consumer Opinion Surveys (MEI_BTS_COS)
  mei_bts_cos:
    dataflow: "MEI_BTS_COS"
    description: "Business Tendency and Consumer Opinion Surveys"
    
    dimensions:
      # 0: Indicateurs
      - name: "INDICATOR"
        position: 0
        values:
          # Manufacturing
          - BSPRTE        # Production > Tendency
          - BSPRFT        # Production > Future Tendency
          - BSFGLV        # Finished goods stocks > Level
          - BSOBLV        # Order books > Level
          - BSXRLV        # Export orders books > Level
          - BSSPFT        # Selling prices > Future tendency
          - BSEMFT        # Employment > Future Tendency
          - BSCI          # Confidence indicators
          - BSCURT        # Capacity Utilisation > Rate
          # Construction
          - BCBUTE        # Business situation > Tendency
          - BCCI          # Confidence indicators
          - BCOBLV        # Order books > Level
          - BCEMFT        # Employment > Future tendency
          - BCSPFT        # Selling Prices > Future tendency
          # Retail trade
          - BRBUTE        # Business situation > Tendency
          - BRBUFT        # Business situation > Future Tendency
          - BRCI          # Confidence indicators
          - BRVSLV        # Volume of stocks > Level
          - BREMFT        # Employment > Future tendency
          - BRODFT        # Order intentions > Future tendency
          # Services
          - BVBUTE        # Business situation > Tendency
          - BVCI          # Confidence indicators
          - BVDETE        # Demand evolution > Tendency
          - BVDEFT        # Demand evolution > Future tendency
          - BVEMTE        # Employment > Tendency
          - BVEMFT        # Employment > Future tendency
          # Consumer
          - CSESFT        # Economic situation > Future tendency
          - CSINFT        # Prices > Future tendency
          - CSCI          # Confidence indicators
          - CSCICP02      # Confidence indicators (alt code)
      
      # 1: Pays
